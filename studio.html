<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawd studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  /* the canvas keeps its own aspect (W×H from the format) and fits the window: wide frames by width, tall ones by height */
  #stage { position: relative; justify-self: start; line-height: 0; }
  #out { display: block; max-width: min(100%, 1280px); max-height: calc(100vh - 64px); width: auto; height: auto; background: #F3EBDC; }
  #safe { position: absolute; outline: 2px dashed rgba(255, 40, 120, .85); pointer-events: none; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <div id="stage"><canvas id="out" width="1920" height="1080"></canvas><div id="safe" hidden></div></div>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span>
    <label title="the area the app's UI doesn't cover (SAFE in core.js); never drawn into the video"><input id="safebox" type="checkbox"> safe zone</label></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<!-- your video: add a script per scene file, in order. The demo stages itself for the format (vertical or landscape). -->
<script src="src/scenes/demo.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video, ?format=landscape to
  // override PROJECT.format, and ?safe to show the safe zone in any format.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
